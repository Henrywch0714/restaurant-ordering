<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Menu Book - Delicious Bites Restaurant</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="icon-new.jpg">
    
    <link rel="stylesheet" href="menu-book.css?v=2">
    <link rel="stylesheet" href="menu-book-cover.css?v=2">
</head>
<body>
    <!-- Language Switcher (Fixed Position) -->
    <div class="language-switcher-fixed">
        <button id="langEn" class="lang-btn">EN</button>
        <button id="langZh" class="lang-btn">繁</button>
        <button id="langZhCN" class="lang-btn">簡</button>
    </div>

    <!-- Main Content -->
    <main class="book-container">
        <!-- Table of Contents (Left Sidebar) -->
        <aside class="table-of-contents" id="tableOfContents">
            <h2>Table</h2>
            <nav class="toc-nav">
                <ul id="tocList">
                    <!-- Will be populated by JavaScript -->
                </ul>
            </nav>
            <button class="cart-shortcut" id="cartShortcut" aria-label="View cart">
                <span class="cart-icon">🛒</span>
                <span class="cart-count-bubble" id="cartCountBubble">0</span>
            </button>
        </aside>

        <!-- Book Pages Container -->
        <div class="book-wrapper">
            <div class="book-pages" id="bookPages">
                <!-- Pages will be dynamically generated by JavaScript -->
            </div>
            
            <!-- Navigation Controls -->
            <div class="book-navigation">
                <button class="nav-btn prev-btn" id="prevBtn" aria-label="Previous page">
                    <span class="nav-icon">◀</span>
                    <span class="nav-text">Previous</span>
                </button>
                <div class="page-indicator">
                    <span id="pageNumber">1</span>
                    <span class="separator">/</span>
                    <span id="totalPages">1</span>
                </div>
                <button class="nav-btn next-btn" id="nextBtn" aria-label="Next page">
                    <span class="nav-text">Next</span>
                    <span class="nav-icon">▶</span>
                </button>
            </div>
        </div>
        
        <!-- Fixed Microphone and Message Button (next to book) -->
        <div class="fixed-chat-controls">
            <button id="voiceInputBtnBook" class="mic-btn-fixed" title="Click to speak">
                <span class="mic-icon-fixed">🎤</span>
            </button>
            <button id="messageBtnBook" class="message-btn-fixed" title="Type a message">
                <span class="message-icon-fixed">💬</span>
            </button>
        </div>
        
        <!-- Text Input Field (appears when message button clicked) -->
        <div class="text-input-overlay" id="textInputOverlay" style="display: none;">
            <div class="text-input-panel">
                <input type="text" id="chatbotInputBook" placeholder="Type your message..." class="text-input-fixed">
                <button id="sendMessageBtnBook" class="send-btn-fixed">Send</button>
            </div>
        </div>
        
        <!-- Conversation Cloud (appears when bot responds) -->
        <div class="conversation-cloud-overlay" id="conversationCloudOverlay" style="display: none;">
            <div class="conversation-cloud-panel">
                <div class="conversation-cloud-content" id="conversationCloudContent">
                    <!-- AI response will be shown here -->
                </div>
                <div class="conversation-cloud-controls">
                    <button id="voiceInputBtnCloud" class="mic-btn-cloud" title="Click to speak">
                        <span class="mic-icon-cloud">🎤</span>
                    </button>
                    <button id="messageBtnCloud" class="message-btn-cloud" title="Type a message">
                        <span class="message-icon-cloud">💬</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Welcome Window -->
    <div class="welcome-window" id="welcomeWindow">
        <div class="welcome-window-content">
            <div class="welcome-header">
                <img src="icon-new.jpg" alt="Restaurant logo" class="welcome-logo">
                <h2 class="welcome-restaurant-name">Delicious Bites Restaurant</h2>
            </div>
            <div class="welcome-waiter-image">
                <img src="waiter1.png" alt="Waiter" class="welcome-waiter-img">
            </div>
            <div class="welcome-message">
                <p>Talk or send message to me, I can do everything for you!!!</p>
            </div>
            <div class="welcome-buttons">
                <button class="welcome-mic-btn" disabled>
                    <span class="welcome-mic-icon">🎤</span>
                </button>
                <button class="welcome-message-btn" disabled>
                    <span class="welcome-message-icon">💬</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p>Loading menu...</p>
    </div>

    <!-- Cart Modal -->
    <div class="cart-modal" id="cartModal" style="display: none;">
        <div class="cart-modal-content">
            <button class="cart-close-btn" id="cartCloseBtn" aria-label="Close cart">✕</button>
            <h2>Your Cart</h2>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total">
                <span>Total</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <div class="cart-payment">
                <label for="paymentMethod">Payment Method (demo)</label>
                <select id="paymentMethod">
                    <option value="card">Credit Card</option>
                    <option value="cash">Cash</option>
                    <option value="mobile">Mobile Pay</option>
                </select>
                <button class="cart-pay-btn" id="cartPayBtn">Confirm Payment</button>
            </div>
        </div>
    </div>

    <script src="translations.js?v=2"></script>
    <script src="menu-book.js?v=2"></script>
    <script src="recommendation.js?v=2"></script>
</body>
</html>
